        `).join('')}
      </div>

      <details class="px-5 pb-5">
        <summary class="text-xs text-amber-400 cursor-pointer hover:text-amber-300 mono uppercase tracking-widest">↓ ver diferença + recomendação</summary>
        <div class="mt-3 space-y-3 text-sm">
          <div class="bg-gray-800/40 rounded p-3">
            <div class="text-[10px] uppercase tracking-widest text-gray-500 mono mb-1">Diferença</div>
            <p>${cat.diff}</p>
          </div>
          <div class="bg-amber-950/30 border-l-4 border-amber-500 rounded-r p-3">
            <div class="text-[10px] uppercase tracking-widest text-amber-400 mono mb-1">Recomendação</div>
            <p class="text-amber-50">${cat.recommendation}</p>
          </div>
        </div>
      </details>
    </div>
  `;
  main.insertAdjacentHTML('beforeend', html);
});

// ─── LOGIC ───
function load() {
  const saved = JSON.parse(localStorage.getItem(STORAGE) || '{}');
  Object.entries(saved).forEach(([catId, optId]) => {
    const radio = document.querySelector(`.cat-radio[data-cat="${catId}"][data-name="${optId}"]`);
    if (radio) radio.checked = true;
  });
  updateAll();
}
function save() {
  const state = {};
  document.querySelectorAll('.cat-radio:checked').forEach(r => {
    state[r.dataset.cat] = r.dataset.name;
  });
  localStorage.setItem(STORAGE, JSON.stringify(state));
}
function updateAll() {
  let resolved = 0;
  OVERLAPS.forEach(cat => {
    const checked = document.querySelector(`.cat-radio[data-cat="${cat.id}"]:checked`);
    const card = document.querySelector(`.cat-card[data-cat="${cat.id}"]`);
    const status = card.querySelector('.cat-status');
    if (checked) {
      resolved++;
      card.classList.add('card-resolved');
      status.textContent = '✓ resolvida';
      status.className = 'cat-status text-xs mono uppercase tracking-widest text-emerald-400 font-bold';
    } else {
      card.classList.remove('card-resolved');
      status.textContent = 'aguardando';
      status.className = 'cat-status text-xs mono uppercase tracking-widest text-gray-500';
    }
  });
  document.getElementById('count-resolved').textContent = resolved;
}

document.querySelectorAll('.cat-radio').forEach(r => {
  r.addEventListener('change', () => { save(); updateAll(); });
});

document.getElementById('apply-recommended').addEventListener('click', () => {
  OVERLAPS.forEach(cat => {
    const recOpt = cat.options.find(o => o.recommended);
    if (recOpt) {
      const radio = document.querySelector(`.cat-radio[data-cat="${cat.id}"][data-name="${recOpt.id}"]`);
      if (radio) radio.checked = true;
    }
  });
  save(); updateAll();
  showStatus('✓ Recomendadas aplicadas (' + OVERLAPS.filter(c => c.options.some(o => o.recommended)).length + ' categorias)');
});

document.getElementById('reset-all').addEventListener('click', () => {
  if (!confirm('Limpar todas as escolhas?')) return;
  document.querySelectorAll('.cat-radio').forEach(r => r.checked = false);
  save(); updateAll();
});

document.getElementById('export-json').addEventListener('click', () => {
  const state = JSON.parse(localStorage.getItem(STORAGE) || '{}');
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), canonicals: state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `arsenal-canonicas-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
});

document.getElementById('export-text').addEventListener('click', async () => {
  const state = JSON.parse(localStorage.getItem(STORAGE) || '{}');
  let txt = `MINHAS ESCOLHAS CANÔNICAS DO ARSENAL\nData: ${new Date().toLocaleString('pt-BR')}\n\n`;
  OVERLAPS.forEach(cat => {
    const choice = state[cat.id];
    txt += `\n═══ ${cat.title} ═══\n`;
    if (choice) {
      txt += `→ USAR: ${choice}\n`;
      const others = cat.options.filter(o => o.id !== choice).map(o => o.id);
      if (others.length) txt += `  ignorar: ${others.join(', ')}\n`;
    } else {
      txt += `→ (não decidido)\n`;
    }
  });
  try {
    await navigator.clipboard.writeText(txt);
    showStatus('✓ Copiado pra área de transferência');
  } catch {
    const blob = new Blob([txt], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `arsenal-canonicas-${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
  }
});

function showStatus(msg) {
  const s = document.getElementById('status-bar');
  s.textContent = msg;
  s.classList.remove('hidden');
  setTimeout(() => s.classList.add('hidden'), 3500);
}

load();
</script>

</body>
</html>
