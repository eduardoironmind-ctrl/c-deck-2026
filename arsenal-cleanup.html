      <div class="border-t border-gray-800 divide-y divide-gray-800/60">

          <label class="item flex items-start gap-3 p-3 hover:bg-gray-800/30 cursor-pointer" data-block-id="${block.id}">
            <input type="checkbox" class="mt-1 item-check" data-block-id="${block.id}" data-name="${item.name.replace(/"/g, '&quot;')}" data-type="${item.type}">

// ═══════════ LOGIC ═══════════
function load() {
  const saved = JSON.parse(localStorage.getItem(STORAGE) || '[]');
  document.querySelectorAll('.item-check').forEach(cb => {
    if (saved.includes(cb.dataset.name)) cb.checked = true;
  });
  updateCounts();
}

function save() {
  const checked = Array.from(document.querySelectorAll('.item-check:checked')).map(cb => cb.dataset.name);
  localStorage.setItem(STORAGE, JSON.stringify(checked));
}

function updateCounts() {
  const totalChecked = document.querySelectorAll('.item-check:checked').length;
  document.getElementById('count-marked').textContent = totalChecked;
  BLOCKS.forEach(block => {
    const blockChecked = document.querySelectorAll(`.item-check[data-block-id="${block.id}"]:checked`).length;
    const el = document.querySelector(`.block-count[data-block-id="${block.id}"]`);
    if (el) el.textContent = blockChecked;
  });
}

document.querySelectorAll('.item-check').forEach(cb => {
  cb.addEventListener('change', () => { save(); updateCounts(); });
});

document.querySelectorAll('.select-block').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    const id = btn.dataset.blockId;
    document.querySelectorAll(`.item-check[data-block-id="${id}"]`).forEach(cb => cb.checked = true);
    save(); updateCounts();
  });
});

document.querySelectorAll('.deselect-block').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    const id = btn.dataset.blockId;
    document.querySelectorAll(`.item-check[data-block-id="${id}"]`).forEach(cb => cb.checked = false);
    save(); updateCounts();
  });
});

document.getElementById('select-all-recommended').addEventListener('click', () => {
  RECOMMENDED_BLOCKS.forEach(id => {
    document.querySelectorAll(`.item-check[data-block-id="${id}"]`).forEach(cb => cb.checked = true);
  });
  save(); updateCounts();
  showStatus('✓ Marcados todos os blocos de severidade ALTA recomendada');
});

document.getElementById('reset-all').addEventListener('click', () => {
  if (!confirm('Limpar TODAS as marcações?')) return;
  document.querySelectorAll('.item-check').forEach(cb => cb.checked = false);
  save(); updateCounts();
  showStatus('Todas as marcações limpas');
});

document.getElementById('export-json').addEventListener('click', () => {
  const checked = Array.from(document.querySelectorAll('.item-check:checked')).map(cb => ({
    name: cb.dataset.name,
    type: cb.dataset.type,
    block: cb.dataset.blockId
  }));
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), count: checked.length, items: checked }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `arsenal-remover-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showStatus(`✓ ${checked.length} itens exportados como JSON`);
});

document.getElementById('export-text').addEventListener('click', async () => {
  const grouped = {};
  document.querySelectorAll('.item-check:checked').forEach(cb => {
    const b = cb.dataset.blockId;
    if (!grouped[b]) grouped[b] = [];
    grouped[b].push({ name: cb.dataset.name, type: cb.dataset.type });
  });

  let txt = `ARSENAL · ITENS MARCADOS PRA REMOVER\nData: ${new Date().toLocaleString('pt-BR')}\nTotal: ${document.querySelectorAll('.item-check:checked').length} itens\n\n`;

  Object.keys(grouped).forEach(blockId => {
    const block = BLOCKS.find(b => b.id === blockId);
    txt += `\n═══ ${block.title} (${grouped[blockId].length} itens) ═══\n`;
    grouped[blockId].forEach(i => {
      txt += `  [${i.type}] ${i.name}\n`;
    });
  });

  try {
    await navigator.clipboard.writeText(txt);
    showStatus('✓ Lista copiada pra área de transferência · cola onde quiser');
  } catch {
    const blob = new Blob([txt], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `arsenal-remover-${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    showStatus('✓ Lista baixada como .txt (clipboard não funcionou)');
  }
});

function showStatus(msg) {
  const s = document.getElementById('status-bar');
  s.textContent = msg;
  s.classList.remove('hidden');
  setTimeout(() => s.classList.add('hidden'), 4000);
}

load();
</script>

</body>
</html>
